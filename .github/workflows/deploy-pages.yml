name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
    # NOTE: leetcode_java/ and leetcode_python/ are NOT ignored — site/build-leetcode.js
    # scans both to build the LC Explorer JSON, so a new solution must redeploy the site.
    paths-ignore:
      - 'leetcode_SQL/**'
      - 'leetcode_scala/**'
      - 'algorithm/**'
      - 'data_structure/**'
      - 'ref_code/**'
      - 'script/**'
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('site/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      run: npm ci --prefix site

    - name: Build site
      run: bash site/build.sh

    # The same gate validate-pages.yml runs on a PR, repeated here so a push that
    # skipped that workflow's path filter still cannot publish a broken tree —
    # dead links and missing pages are cheaper to catch before they go live than
    # after.
    - name: Validate the generated site
      run: node site/e2e-check.js _site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
